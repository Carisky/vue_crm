<VirtualHost *:80>
    ServerName collab.tsl-silesia.com.pl

    ProxyPreserveHost On
    ProxyRequests Off

    # Only Apache may set this marker. Requests originating from the LAN bypass
    # Basic Auth in the application, while public clients remain protected.
    RequestHeader unset X-Crm-Internal-Request
    SetEnvIfExpr "-R '192.168.0.0/16'" crm_internal_network
    RequestHeader set X-Crm-Internal-Request "1" env=crm_internal_network

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass / http://127.0.0.1:3600/
    ProxyPassReverse / http://127.0.0.1:3600/

    ErrorLog ${APACHE_LOG_DIR}/vue_crm_error.log
    CustomLog ${APACHE_LOG_DIR}/vue_crm_access.log combined
</VirtualHost>
