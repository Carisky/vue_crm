server {
    listen 80;
    listen [::]:80;
    server_name collab.tsl-silesia.com.pl;

    client_max_body_size 50m;

    # Ignore any marker supplied by the client and rebuild it from the source
    # address seen by Nginx. Nitro uses it only to bypass Basic Auth on the LAN.
    set $crm_internal_request "";
    if ($remote_addr ~ "^192\.168\.") {
        set $crm_internal_request "1";
    }

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Crm-Internal-Request $crm_internal_request;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
