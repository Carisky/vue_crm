services:
  mariadb:
    image: mariadb:11.7
    container_name: vue-crm-dev-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: vue_crm_dev
      MARIADB_USER: vue_crm_dev
      MARIADB_PASSWORD: vue_crm_dev_password
      MARIADB_ROOT_PASSWORD: vue_crm_dev_root_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - vue_crm_dev_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vue_crm_dev_db:
